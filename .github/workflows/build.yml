# Builds Nightly Browser for macOS (universal), Windows and Linux (x86_64 + arm64)
# on GitHub-hosted runners, signs the MARs and optionally publishes:
#   - a GitHub release (tag = displayVersion for "release", "twilight" for beta)
#   - update.xml files on gh-pages under updates/browser/<target>/<channel>/
#     (served at https://samnolak.github.io/nightly-browser/, see surfer.json)
#
# Repository secrets
#   Required for MAR signing (scripts/mar_sign.sh):
#     NIGHTLY_SIGNING_CERT_PEM_BASE64, NIGHTLY_SIGNING_PRIVATE_KEY_PEM_BASE64,
#     NIGHTLY_MAR_SIGNING_PASSWORD
#   Optional API keys (written to ~/.nightly-keys during the build):
#     NIGHTLY_SAFEBROWSING_API_KEY, NIGHTLY_MOZILLA_API_KEY,
#     NIGHTLY_GOOGLE_LOCATION_SERVICE_API_KEY
#   Optional Windows Authenticode (unsigned builds otherwise):
#     NIGHTLY_WINDOWS_PFX_BASE64, NIGHTLY_WINDOWS_PFX_PASSWORD,
#     NIGHTLY_WINDOWS_CERT_SUBJECT_NAME, NIGHTLY_WINDOWS_CERT_ISSUER
#   Optional macOS Developer ID signing + notarization (ad-hoc signed otherwise):
#     NIGHTLY_MACOS_CERTIFICATE_P12_BASE64, NIGHTLY_MACOS_CERTIFICATE_P12_PASSWORD,
#     NIGHTLY_MACOS_SIGNING_IDENTITY, NIGHTLY_MACOS_PROVISIONING_PROFILE_BASE64,
#     NIGHTLY_APPLE_ID, NIGHTLY_APPLE_TEAM_ID, NIGHTLY_APPLE_APP_PASSWORD

name: Nightly Browser release build

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Update channel: release (stable) or twilight (Nightly Browser Beta)"
        required: true
        default: "release"
        type: choice
        options:
          - "release"
          - "twilight"
      platforms:
        description: "'all' or a comma list of linux-x86_64, linux-aarch64, windows-x86_64, windows-aarch64, macos-x86_64, macos-aarch64"
        required: true
        default: "all"
        type: string
      create_release:
        description: "Publish a GitHub release and the update manifests (requires all platforms)"
        required: false
        default: false
        type: boolean
      display_version:
        description: "Override the channel's displayVersion from surfer.json (leave empty to use it)"
        required: false
        default: ""
        type: string
      use_sccache:
        description: "Use sccache backed by the GitHub Actions cache"
        required: false
        default: true
        type: boolean
      lto:
        description: "Enable thin LTO (slower builds; watch the 6h job limit)"
        required: false
        default: false
        type: boolean

concurrency:
  group: build-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    name: Plan build
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      build_id: ${{ steps.plan.outputs.build_id }}
      build_date: ${{ steps.plan.outputs.build_date }}
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
      macos: ${{ steps.plan.outputs.macos }}
      macos_universal: ${{ steps.plan.outputs.macos_universal }}
      all_platforms: ${{ steps.plan.outputs.all_platforms }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          PLATFORMS: ${{ inputs.platforms }}
          CREATE_RELEASE: ${{ inputs.create_release }}
          DISPLAY_VERSION: ${{ inputs.display_version }}
        run: |
          set -euo pipefail
          all="linux-x86_64,linux-aarch64,windows-x86_64,windows-aarch64,macos-x86_64,macos-aarch64"
          plats="${PLATFORMS// /}"
          if [ "$plats" = "all" ]; then plats="$all"; fi

          linux=(); windows=(); macos=()
          IFS=',' read -ra items <<< "$plats"
          for p in "${items[@]}"; do
            case "$p" in
              linux-x86_64|linux-aarch64) linux+=("${p#linux-}") ;;
              windows-x86_64|windows-aarch64) windows+=("${p#windows-}") ;;
              macos-x86_64|macos-aarch64) macos+=("${p#macos-}") ;;
              *) echo "::error::Unknown platform '$p'. Use 'all' or a comma list of: $all"; exit 1 ;;
            esac
          done
          to_json() { printf '%s\n' "$@" | sed '/^$/d' | sort -u | jq -R . | jq -cs .; }
          linux_json=$(to_json "${linux[@]}")
          windows_json=$(to_json "${windows[@]}")
          macos_json=$(to_json "${macos[@]}")
          macos_universal=$([ "$(jq length <<< "$macos_json")" = 2 ] && echo true || echo false)
          all_platforms=false
          if [ "$(jq length <<< "$linux_json")" = 2 ] && [ "$(jq length <<< "$windows_json")" = 2 ] && [ "$macos_universal" = true ]; then
            all_platforms=true
          fi

          version="$DISPLAY_VERSION"
          if [ -z "$version" ]; then
            version=$(jq -r --arg c "$CHANNEL" '.brands[$c].release.displayVersion' surfer.json)
          fi
          if ! [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::Invalid display version '$version'"
            exit 1
          fi
          # Tags must match the MAR URLs surfer writes into update.xml.
          if [ "$CHANNEL" = "release" ]; then tag="$version"; else tag="twilight"; fi

          if [ "$CREATE_RELEASE" = "true" ]; then
            if [ "$all_platforms" != "true" ]; then
              echo "::error::create_release needs all six platforms (update manifests are published for every target)."
              exit 1
            fi
            if [ "$CHANNEL" = "release" ] && gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "::error::Release $tag already exists. Bump brands.release.release.displayVersion in surfer.json or pass display_version."
              exit 1
            fi
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "build_id=$(date -u +%Y%m%d%H%M%S)"
            echo "build_date=$(date -u +%Y-%m-%d)"
            echo "linux=$linux_json"
            echo "windows=$windows_json"
            echo "macos=$macos_json"
            echo "macos_universal=$macos_universal"
            echo "all_platforms=$all_platforms"
          } | tee -a "$GITHUB_OUTPUT"

  source:
    name: Source tarball
    if: ${{ inputs.create_release }}
    needs: setup
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Load Surfer CI setup
        env:
          CHANNEL: ${{ inputs.channel }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: npm run surfer -- ci --brand "$CHANNEL" --display-version "$VERSION"

      - name: Download Firefox source and dependencies
        run: npm run download --verbose

      - name: Import
        run: npm run import -- --verbose

      - name: Build language packs
        run: sh scripts/download-language-packs.sh

      - name: Compress
        run: |
          tar \
            --exclude='./.git' \
            --use-compress-program=zstd \
            -hcf nightly.source.tar.zst \
            -C engine .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          retention-days: 5
          name: nightly.source.tar.zst
          path: ./nightly.source.tar.zst

  linux:
    name: Linux
    needs: setup
    if: ${{ needs.setup.outputs.linux != '[]' }}
    uses: ./.github/workflows/linux-release-build.yml
    secrets: inherit
    with:
      arches: ${{ needs.setup.outputs.linux }}
      build-version: ${{ needs.setup.outputs.version }}
      release-branch: ${{ inputs.channel }}
      MOZ_BUILD_DATE: ${{ needs.setup.outputs.build_id }}
      use-sccache: ${{ inputs.use_sccache }}
      lto: ${{ inputs.lto }}

  windows:
    name: Windows
    needs: setup
    if: ${{ needs.setup.outputs.windows != '[]' }}
    uses: ./.github/workflows/windows-release-build.yml
    secrets: inherit
    with:
      arches: ${{ needs.setup.outputs.windows }}
      build-version: ${{ needs.setup.outputs.version }}
      release-branch: ${{ inputs.channel }}
      MOZ_BUILD_DATE: ${{ needs.setup.outputs.build_id }}
      use-sccache: ${{ inputs.use_sccache }}
      lto: ${{ inputs.lto }}

  macos:
    name: macOS
    needs: setup
    if: ${{ needs.setup.outputs.macos != '[]' }}
    uses: ./.github/workflows/macos-release-build.yml
    secrets: inherit
    with:
      arches: ${{ needs.setup.outputs.macos }}
      build-version: ${{ needs.setup.outputs.version }}
      release-branch: ${{ inputs.channel }}
      MOZ_BUILD_DATE: ${{ needs.setup.outputs.build_id }}
      use-sccache: ${{ inputs.use_sccache }}
      lto: ${{ inputs.lto }}

  macos-universal:
    name: macOS Universal
    needs: [setup, macos]
    if: ${{ needs.setup.outputs.macos_universal == 'true' }}
    uses: ./.github/workflows/macos-universal-release-build.yml
    secrets: inherit
    with:
      build-version: ${{ needs.setup.outputs.version }}
      release-branch: ${{ inputs.channel }}

  appimage:
    name: AppImage - Linux ${{ matrix.arch }}
    needs: [setup, linux]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.setup.outputs.linux) }}
    env:
      ARCH: ${{ matrix.arch }}
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ needs.setup.outputs.version }}
      ZSYNC_TAG: ${{ inputs.channel == 'release' && 'latest' || 'twilight' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install libfuse2 desktop-file-utils appstream

      - name: Download Linux build
        uses: actions/download-artifact@v7
        with:
          name: nightly.linux-${{ matrix.arch }}.tar.xz

      - name: Build AppImage
        run: |
          set -eux
          APPDIR=build/AppDir
          UPINFO="gh-releases-zsync|${GITHUB_REPOSITORY%%/*}|${GITHUB_REPOSITORY##*/}|$ZSYNC_TAG|nightly-$ARCH.AppImage.zsync"
          rm -f "$APPDIR/.DirIcon"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/128x128/apps"
          cp "configs/branding/$CHANNEL/logo128.png" "$APPDIR/usr/share/icons/hicolor/128x128/apps/nightly.png"
          cp "configs/branding/$CHANNEL/logo128.png" "$APPDIR/nightly.png"
          ln -s nightly.png "$APPDIR/.DirIcon"

          if [ "$CHANNEL" = "twilight" ]; then
            sed -i -e 's/^Name=Nightly Browser$/Name=Nightly Browser Beta/' "$APPDIR/nightly.desktop"
            sed -i -e 's/^StartupWMClass=nightly$/StartupWMClass=nightly-twilight/' "$APPDIR/nightly.desktop"
          fi
          sed -i -e "s/\$VERSION/$VERSION/g" "$APPDIR/nightly.desktop"

          tar -xf ./*.tar.* && rm -f ./*.tar.*
          mv nightly/* "$APPDIR/"
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          wget -q "https://github.com/VHSgunzo/uruntime/releases/latest/download/uruntime-appimage-squashfs-lite-$ARCH"
          chmod +x ./appimagetool-x86_64.AppImage "./uruntime-appimage-squashfs-lite-$ARCH" "$APPDIR/AppRun"

          # keep the uruntime mountpoint (massively speeds up launch time)
          sed -i 's|URUNTIME_MOUNT=[0-9]|URUNTIME_MOUNT=0|' "./uruntime-appimage-squashfs-lite-$ARCH"

          ./appimagetool-x86_64.AppImage -u "$UPINFO" "$APPDIR" "nightly-$ARCH.AppImage" --runtime-file "./uruntime-appimage-squashfs-lite-$ARCH"
          mkdir dist
          mv nightly-*.AppImage* dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          retention-days: 5
          name: nightly-${{ matrix.arch }}.AppImage
          path: ./dist/nightly-${{ matrix.arch }}.AppImage

      - name: Upload artifact (ZSync)
        uses: actions/upload-artifact@v6
        with:
          retention-days: 5
          name: nightly-${{ matrix.arch }}.AppImage.zsync
          path: ./dist/nightly-${{ matrix.arch }}.AppImage.zsync

  release:
    name: Sign MARs and publish
    needs: [setup, source, linux, windows, macos-universal, appimage]
    # Runs for every full build: MARs are signed and verified even when nothing is
    # published, so the signing pipeline is exercised by test builds too.
    if: >-
      ${{ !cancelled() && needs.setup.outputs.all_platforms == 'true'
      && needs.linux.result == 'success' && needs.windows.result == 'success'
      && needs.macos-universal.result == 'success' && needs.appimage.result == 'success'
      && (needs.source.result == 'success' || needs.source.result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CHANNEL: ${{ inputs.channel }}
      RELEASE_BRANCH: ${{ inputs.channel }}
      VERSION: ${{ needs.setup.outputs.version }}
      TAG: ${{ needs.setup.outputs.tag }}
      BUILD_DATE: ${{ needs.setup.outputs.build_date }}
      MACOS_NOTARIZED: ${{ secrets.NIGHTLY_MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.NIGHTLY_APPLE_ID != '' && secrets.NIGHTLY_APPLE_TEAM_ID != '' && secrets.NIGHTLY_APPLE_APP_PASSWORD != '' }}
      WINDOWS_SIGNED: ${{ secrets.NIGHTLY_WINDOWS_PFX_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Download artifacts
        uses: actions/download-artifact@v7

      - name: Install NSS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3-tools

      - name: Prepare signmar
        run: |
          # signmar links against the NSS libraries built next to it.
          dir="$GITHUB_WORKSPACE/linux-signmar-x86_64"
          chmod +x "$dir/signmar"
          printf '#!/bin/sh\nLD_LIBRARY_PATH="%s" exec "%s/signmar" "$@"\n' "$dir" "$dir" > "$RUNNER_TEMP/signmar"
          chmod +x "$RUNNER_TEMP/signmar"
          echo "SIGNMAR=$RUNNER_TEMP/signmar" >> "$GITHUB_ENV"

      - name: Sign MAR files
        env:
          NIGHTLY_MAR_SIGNING_PASSWORD: ${{ secrets.NIGHTLY_MAR_SIGNING_PASSWORD }}
          NIGHTLY_SIGNING_CERT_PEM_BASE64: ${{ secrets.NIGHTLY_SIGNING_CERT_PEM_BASE64 }}
          NIGHTLY_SIGNING_PRIVATE_KEY_PEM_BASE64: ${{ secrets.NIGHTLY_SIGNING_PRIVATE_KEY_PEM_BASE64 }}
        run: bash scripts/mar_sign.sh -s

      - name: Verify MARs and update manifests
        run: bash scripts/mar_verify.sh

      - name: Upload signed update files
        uses: actions/upload-artifact@v6
        with:
          retention-days: 5
          name: signed-update-files
          path: |
            ./*.mar/*.mar
            ./*_update_manifest*/

      - name: Generate release notes
        run: bash .github/workflows/src/generate_release_notes.sh

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir release-assets
          files=(
            nightly.source.tar.zst/nightly.source.tar.zst
            nightly.linux-x86_64.tar.xz/nightly.linux-x86_64.tar.xz
            nightly.linux-aarch64.tar.xz/nightly.linux-aarch64.tar.xz
            nightly-x86_64.AppImage/nightly-x86_64.AppImage
            nightly-x86_64.AppImage.zsync/nightly-x86_64.AppImage.zsync
            nightly-aarch64.AppImage/nightly-aarch64.AppImage
            nightly-aarch64.AppImage.zsync/nightly-aarch64.AppImage.zsync
            linux.mar/linux.mar
            linux-aarch64.mar/linux-aarch64.mar
            windows.mar/windows.mar
            windows-arm64.mar/windows-arm64.mar
            macos.mar/macos.mar
            nightly.installer.exe/nightly.installer.exe
            nightly.installer-arm64.exe/nightly.installer-arm64.exe
            nightly.win-x86_64.zip/nightly.win-x86_64.zip
            nightly.win-arm64.zip/nightly.win-arm64.zip
            nightly.macos-universal.dmg/nightly.macos-universal.dmg
          )
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              cp "$f" release-assets/
            elif [ "$f" = nightly.source.tar.zst/nightly.source.tar.zst ]; then
              echo "Source tarball is only built for published releases"
            else
              echo "::error::Missing release asset $f"
              exit 1
            fi
          done
          if [ "$CHANNEL" = "release" ]; then
            tar -cf release-assets/flatpak-metadata.tar -C build/flatpak/metadata .
            python3 scripts/prepare-flatpak-release.py \
              --version "$VERSION" \
              --linux-archive release-assets/nightly.linux-x86_64.tar.xz \
              --linux-aarch64-archive release-assets/nightly.linux-aarch64.tar.xz \
              --flatpak-archive release-assets/flatpak-metadata.tar \
              --template-root build/flatpak \
              --output release-assets/io.github.samnolak.nightly.yml
          fi
          (cd release-assets && sha256sum -- * > SHA256SUMS)
          ls -la release-assets

      - name: Publish GitHub release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.channel == 'release' && format('Nightly Browser {0}', needs.setup.outputs.version) || format('Nightly Browser Beta {0} ({1})', needs.setup.outputs.version, needs.setup.outputs.build_date) }}
          NOTES_FILE: release_notes.md
        run: bash .github/workflows/src/publish_release.sh release-assets/*

      # Clients only learn about the update once update.xml changes, so this runs
      # after every MAR it points to has been uploaded.
      - name: Publish update manifests to GitHub Pages
        if: ${{ inputs.create_release }}
        env:
          PUBLISH_LABEL: ${{ inputs.channel }} ${{ needs.setup.outputs.version }}
        run: |
          bash scripts/github_pages.sh publish \
            linux_update_manifest_x86_64 linux_update_manifest_aarch64 \
            windows_update_manifest_x86_64 windows_update_manifest_arm64 \
            macos_update_manifest
