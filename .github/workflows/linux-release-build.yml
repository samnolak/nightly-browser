name: Linux Release Build

on:
  workflow_call:
    inputs:
      arches:
        description: 'JSON list of architectures to build, e.g. ["x86_64","aarch64"]'
        required: true
        type: string
      build-version:
        description: "The version to build"
        required: true
        type: string
      release-branch:
        description: "The channel to build (release or twilight)"
        required: true
        type: string
      MOZ_BUILD_DATE:
        type: string
        required: true
      use-sccache:
        description: "Use sccache with the GitHub Actions cache"
        required: true
        type: boolean
      lto:
        description: "Enable thin LTO"
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  build-linux:
    name: Build Linux - ${{ matrix.arch }}
    # Cross-compiled on x86_64 for both targets with Mozilla's bootstrapped toolchains.
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    env:
      SCCACHE_GHA_ENABLED: ${{ inputs.use-sccache && 'true' || 'false' }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      SURFER_COMPAT: ${{ matrix.arch }}
      SURFER_PLATFORM: linux
      ZEN_GA_DISABLE_PGO: 1
      ZEN_DISABLE_LTO: ${{ !inputs.lto && '1' || '' }}
      MOZ_BUILD_DATE: ${{ inputs.MOZ_BUILD_DATE }}

    steps:
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force > /dev/null || true
          sudo fallocate -l 12G /mnt/nightly-swap && sudo chmod 600 /mnt/nightly-swap
          sudo mkswap /mnt/nightly-swap > /dev/null && sudo swapon /mnt/nightly-swap
          df -h / /mnt && free -h

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
        if: ${{ inputs.use-sccache }}
        with:
          disable_annotations: true

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip dos2unix yasm nasm build-essential libgtk2.0-dev libpython3-dev m4 uuid libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdrm-dev libdbus-glib-1-dev libgtk-3-dev libpulse-dev libx11-xcb-dev libxt-dev xvfb lld llvm

      - name: Install dependencies
        run: npm ci

      - name: Load Surfer CI setup
        env:
          CHANNEL: ${{ inputs.release-branch }}
          VERSION: ${{ inputs.build-version }}
        run: npm run surfer -- ci --brand "$CHANNEL" --display-version "$VERSION"

      - name: Download Firefox source and dependencies
        run: npm run download

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "$(cat .rust-toolchain)"
          . "$HOME/.cargo/env"
          rustup target add "${SURFER_COMPAT}-unknown-linux-gnu"

      - name: Import
        run: |
          . "$HOME/.cargo/env"
          npm run import

      - name: Build language packs
        run: sh scripts/download-language-packs.sh

      - name: Bootstrap
        working-directory: engine
        run: ./mach --no-interactive bootstrap --application-choice browser

      - name: Build
        env:
          NIGHTLY_SAFEBROWSING_API_KEY: ${{ secrets.NIGHTLY_SAFEBROWSING_API_KEY }}
          NIGHTLY_MOZILLA_API_KEY: ${{ secrets.NIGHTLY_MOZILLA_API_KEY }}
          NIGHTLY_GOOGLE_LOCATION_SERVICE_API_KEY: ${{ secrets.NIGHTLY_GOOGLE_LOCATION_SERVICE_API_KEY }}
        run: bash .github/workflows/src/release-build.sh

      - name: Package
        env:
          ZEN_RELEASE: 1
        run: npm run package

      - name: Rename artifacts
        run: |
          set -x
          mv dist/nightly-*.tar.xz "nightly.linux-${SURFER_COMPAT}.tar.xz"
          mv dist/output.mar "linux${{ matrix.arch == 'aarch64' && '-aarch64' || '' }}.mar"

      - name: Upload build artifact (binary)
        uses: actions/upload-artifact@v6
        with:
          retention-days: 5
          name: nightly.linux-${{ matrix.arch }}.tar.xz
          path: ./nightly.linux-${{ matrix.arch }}.tar.xz

      - name: Upload build artifact (.mar)
        uses: actions/upload-artifact@v6
        with:
          retention-days: 5
          name: linux${{ matrix.arch == 'aarch64' && '-aarch64' || '' }}.mar
          path: ./linux${{ matrix.arch == 'aarch64' && '-aarch64' || '' }}.mar

      - name: Upload build artifact (update manifests)
        uses: actions/upload-artifact@v6
        with:
          retention-days: 5
          name: linux_update_manifest_${{ matrix.arch }}
          path: ./dist/update

      # signmar (and the NSS libraries it loads) signs every platform's MAR in the
      # release job.
      - name: Upload signmar
        if: ${{ matrix.arch == 'x86_64' }}
        uses: actions/upload-artifact@v6
        with:
          retention-days: 2
          name: linux-signmar-x86_64
          path: |
            engine/obj-x86_64-pc-linux-gnu/dist/bin/signmar
            engine/obj-x86_64-pc-linux-gnu/dist/bin/lib*.so
            !engine/obj-x86_64-pc-linux-gnu/dist/bin/libxul.so
