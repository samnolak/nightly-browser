name: macOS Release Build

on:
  workflow_call:
    inputs:
      arches:
        description: 'JSON list of architectures to build, e.g. ["x86_64","aarch64"]'
        required: true
        type: string
      build-version:
        description: "The version to build"
        required: true
        type: string
      release-branch:
        description: "The channel to build (release or twilight)"
        required: true
        type: string
      MOZ_BUILD_DATE:
        type: string
        required: true
      use-sccache:
        description: "Use sccache with the GitHub Actions cache"
        required: true
        type: boolean
      lto:
        description: "Enable thin LTO"
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  mac-build:
    name: Build macOS - ${{ matrix.arch }}
    # Cross-compiled from Linux with Mozilla's public toolchains (clang, cctools,
    # libdmg, hfsplus and the macOS SDK fetched by `mach bootstrap`/`mach artifact`).
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    env:
      SCCACHE_GHA_ENABLED: ${{ inputs.use-sccache && 'true' || 'false' }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      SURFER_COMPAT: ${{ matrix.arch }}
      SURFER_PLATFORM: darwin
      ZEN_CROSS_COMPILING: 1
      ZEN_GA_DISABLE_PGO: 1
      ZEN_DISABLE_LTO: ${{ !inputs.lto && '1' || '' }}
      MOZ_BUILD_DATE: ${{ inputs.MOZ_BUILD_DATE }}

    steps:
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force > /dev/null || true
          sudo fallocate -l 12G /mnt/nightly-swap && sudo chmod 600 /mnt/nightly-swap
          sudo mkswap /mnt/nightly-swap > /dev/null && sudo swapon /mnt/nightly-swap
          df -h / /mnt && free -h

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
        if: ${{ inputs.use-sccache }}
        with:
          disable_annotations: true

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip zstd yasm nasm build-essential libgtk2.0-dev libpython3-dev m4 uuid libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdrm-dev libdbus-glib-1-dev libgtk-3-dev libpulse-dev libx11-xcb-dev libxt-dev xvfb --fix-missing

      - name: Load Surfer CI setup
        env:
          CHANNEL: ${{ inputs.release-branch }}
          VERSION: ${{ inputs.build-version }}
        run: npm run surfer -- ci --brand "$CHANNEL" --display-version "$VERSION"

      - name: Download Firefox and dependencies
        run: npm run download

      - name: mac-cross Cache
        id: cache-mac-cross
        uses: actions/cache@v5
        with:
          path: ~/mac-cross
          # Bump the suffix to refresh the cached Mozilla toolchains.
          key: mac-cross-v1

      - name: Setup for macOS (cctools and DMG tools)
        if: steps.cache-mac-cross.outputs.cache-hit != 'true'
        working-directory: engine
        run: |
          set -ex
          rm -rf ~/mac-cross && mkdir -p ~/mac-cross
          ./mach artifact toolchain --from-build linux64-cctools-port linux64-libdmg linux64-hfsplus
          mv cctools dmg hfsplus ~/mac-cross/
          ls ~/mac-cross/cctools/bin/x86_64-apple-darwin-ld ~/mac-cross/cctools/bin/aarch64-apple-darwin-ld ~/mac-cross/dmg/dmg ~/mac-cross/hfsplus/newfs_hfs

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "$(cat .rust-toolchain)"
          . "$HOME/.cargo/env"
          rustup target add "${SURFER_COMPAT}-apple-darwin"

      - name: Import
        run: |
          . "$HOME/.cargo/env"
          npm run import -- --verbose

      - name: Bootstrap
        run: npm run bootstrap

      - name: Build language packs
        run: sh scripts/download-language-packs.sh

      - name: Build
        env:
          NIGHTLY_SAFEBROWSING_API_KEY: ${{ secrets.NIGHTLY_SAFEBROWSING_API_KEY }}
          NIGHTLY_MOZILLA_API_KEY: ${{ secrets.NIGHTLY_MOZILLA_API_KEY }}
          NIGHTLY_GOOGLE_LOCATION_SERVICE_API_KEY: ${{ secrets.NIGHTLY_GOOGLE_LOCATION_SERVICE_API_KEY }}
        run: bash .github/workflows/src/release-build.sh

      - name: Package
        env:
          ZEN_RELEASE: 1
        run: npm run package

      - name: Rename artifacts
        run: |
          set -ex
          mv ./dist/*.dmg "./nightly-${SURFER_COMPAT}-apple-darwin-dist.dmg"
          mv "./engine/obj-${SURFER_COMPAT}-apple-darwin/dist/bin/platform.ini" ./platform.ini

      - name: Upload dist dmg
        uses: actions/upload-artifact@v6
        with:
          retention-days: 2
          name: nightly-${{ matrix.arch }}-apple-darwin-dist.dmg
          path: ./nightly-${{ matrix.arch }}-apple-darwin-dist.dmg

      - name: Upload platform.ini
        uses: actions/upload-artifact@v6
        if: ${{ matrix.arch == 'x86_64' }}
        with:
          retention-days: 2
          name: platform.ini
          path: ./platform.ini
