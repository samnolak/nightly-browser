name: macOS Universal Release Build

on:
  workflow_call:
    inputs:
      build-version:
        description: "The version to build"
        required: true
        type: string
      release-branch:
        description: "The channel to build (release or twilight)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  mac-build:
    name: Unify macOS (Universal)
    runs-on: macos-26
    timeout-minutes: 180
    env:
      # Developer ID signing + notarization are optional; without these secrets the
      # app is ad-hoc signed and the DMG is not notarized.
      HAS_MAC_SIGNING: ${{ secrets.NIGHTLY_MACOS_CERTIFICATE_P12_BASE64 != '' && secrets.NIGHTLY_MACOS_CERTIFICATE_P12_PASSWORD != '' && secrets.NIGHTLY_MACOS_SIGNING_IDENTITY != '' }}
      HAS_MAC_PROFILE: ${{ secrets.NIGHTLY_MACOS_PROVISIONING_PROFILE_BASE64 != '' }}
      HAS_MAC_NOTARIZATION: ${{ secrets.NIGHTLY_APPLE_ID != '' && secrets.NIGHTLY_APPLE_TEAM_ID != '' && secrets.NIGHTLY_APPLE_APP_PASSWORD != '' }}
      SURFER_PLATFORM: darwin
      CHANNEL: ${{ inputs.release-branch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Setup Python
        uses: actions/setup-python@v6
        # Uses the version from .python-version.

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install system dependencies
        run: |
          brew update
          brew install cairo gnu-tar mercurial
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install rcodesign
        if: env.HAS_MAC_SIGNING == 'true'
        run: cargo install apple-codesign --locked --force

      - name: Install dependencies
        run: npm ci

      - name: Load surfer CI setup
        env:
          VERSION: ${{ inputs.build-version }}
        run: npm run surfer -- ci --brand "$CHANNEL" --display-version "$VERSION"

      - name: Download Firefox source and dependencies
        run: npm run download

      # Best effort (as upstream does): bootstrap may report optional system changes
      # it was told not to make; `mach configure` below fails loudly if a required
      # toolchain is missing.
      - name: Bootstrap
        working-directory: engine
        run: ./mach --no-interactive bootstrap --application-choice browser --no-system-changes || true

      - name: Import
        run: npm run import

      - name: Populate mozconfig
        env:
          SURFER_MOZCONFIG_ONLY: true
          ZEN_RELEASE: 1
          ZEN_GA_DISABLE_PGO: true
        run: |
          npm run build
          cd engine
          ./mach configure

      - name: Build host mar tool
        working-directory: engine
        run: |
          set -ex
          echo "ac_add_options --enable-project=tools/update-packaging" > mar-mozconfig
          echo "mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-mar-tools" >> mar-mozconfig
          MOZCONFIG=$PWD/mar-mozconfig ./mach build -v
          cp obj-mar-tools/dist/host/bin/mar ../nightly-macos-host-mar
          rm -rf obj-mar-tools mar-mozconfig

      - name: Download x86_64 DMG from artifacts
        uses: actions/download-artifact@v7
        with:
          name: nightly-x86_64-apple-darwin-dist.dmg

      - name: Download aarch64 DMG from artifacts
        uses: actions/download-artifact@v7
        with:
          name: nightly-aarch64-apple-darwin-dist.dmg

      - name: Extract .app from dmg
        working-directory: engine
        run: |
          set -ex
          rm -rf ./obj-x86_64-apple-darwin ./obj-aarch64-apple-darwin
          mkdir -p ./obj-x86_64-apple-darwin/dist ./obj-aarch64-apple-darwin/dist
          ./mach python -m mozbuild.action.unpack_dmg \
            ../nightly-x86_64-apple-darwin-dist.dmg \
            ./obj-x86_64-apple-darwin/dist
          ./mach python -m mozbuild.action.unpack_dmg \
            ../nightly-aarch64-apple-darwin-dist.dmg \
            ./obj-aarch64-apple-darwin/dist

      - name: Determine app name
        run: |
          # The bundle is named after the channel's brandShortName (MOZ_MACBUNDLE_NAME).
          APP_NAME=$(node -p "require('./surfer.json').brands[process.env.CHANNEL].brandShortName")
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"
          echo "APP_NAME=$APP_NAME"
          find engine/obj-x86_64-apple-darwin/dist -maxdepth 1 -name "*.app" -type d
          test -d "engine/obj-x86_64-apple-darwin/dist/$APP_NAME.app"

      - name: Unify architectures
        working-directory: engine
        run: |
          ./mach python ./toolkit/mozapps/installer/unify.py \
            "./obj-x86_64-apple-darwin/dist/$APP_NAME.app" \
            "./obj-aarch64-apple-darwin/dist/$APP_NAME.app"
          echo "Merged aarch64 into x86_64"

      - name: Prepare Developer ID signing material
        if: env.HAS_MAC_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.NIGHTLY_MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.NIGHTLY_MACOS_CERTIFICATE_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.NIGHTLY_MACOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$P12_PASSWORD" > "$RUNNER_TEMP/developer-id.pass"
          if [ "$HAS_MAC_PROFILE" = "true" ]; then
            # mach macos-sign embeds ./embedded.provisionprofile into the bundle.
            printf '%s' "$PROFILE_BASE64" | base64 --decode > engine/embedded.provisionprofile
          fi

      - name: Import Developer ID certificate into the keychain
        if: env.HAS_MAC_SIGNING == 'true'
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.NIGHTLY_MACOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.NIGHTLY_MACOS_CERTIFICATE_P12_PASSWORD }}

      - name: Sign .app (Developer ID)
        if: env.HAS_MAC_SIGNING == 'true'
        working-directory: engine
        run: |
          # Restricted entitlements need a provisioning profile.
          entitlements=production-without-restricted
          if [ "$HAS_MAC_PROFILE" = "true" ]; then
            entitlements=production
          fi
          ./mach macos-sign -v -r -c release -e "$entitlements" \
            -a "./obj-x86_64-apple-darwin/dist/$APP_NAME.app" \
            --rcodesign-p12-file "$RUNNER_TEMP/developer-id.p12" \
            --rcodesign-p12-password-file "$RUNNER_TEMP/developer-id.pass"

      - name: Sign .app (ad-hoc)
        if: env.HAS_MAC_SIGNING != 'true'
        working-directory: engine
        run: ./mach macos-sign -v -c release -e developer -a "./obj-x86_64-apple-darwin/dist/$APP_NAME.app"

      - name: Create DMG
        working-directory: engine
        run: |
          ./mach python -m mozbuild.action.make_dmg \
            --volume-name "$APP_NAME" \
            --background "./browser/branding/$CHANNEL/background.png" \
            --icon "./browser/branding/$CHANNEL/firefox.icns" \
            --dsstore "./browser/branding/$CHANNEL/dsstore" \
            ./obj-x86_64-apple-darwin/dist/ ../nightly-macOS-universal-temp.dmg
          cd ..
          hdiutil convert nightly-macOS-universal-temp.dmg -format UDZO -imagekey zlib-level=9 -o nightly.macos-universal.dmg

      - name: Sign and notarize .dmg
        if: env.HAS_MAC_SIGNING == 'true'
        env:
          SIGNING_IDENTITY: ${{ secrets.NIGHTLY_MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.NIGHTLY_APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.NIGHTLY_APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.NIGHTLY_APPLE_APP_PASSWORD }}
        run: |
          set -e
          codesign -s "$SIGNING_IDENTITY" nightly.macos-universal.dmg
          if [ "$HAS_MAC_NOTARIZATION" = "true" ]; then
            xcrun notarytool submit nightly.macos-universal.dmg \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --no-s3-acceleration \
              --wait
            xcrun stapler staple nightly.macos-universal.dmg
          else
            echo "::warning::Notarization secrets are not set; the DMG is signed but not notarized."
          fi

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/developer-id.pass" engine/embedded.provisionprofile

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          retention-days: 5
          name: nightly.macos-universal.dmg
          path: ./nightly.macos-universal.dmg

      - name: Download platform.ini
        uses: actions/download-artifact@v7
        with:
          name: platform.ini

      - name: Package for mar
        env:
          JUST_MAR: true
          ZEN_GA_DISABLE_PGO: true
          ZEN_RELEASE: 1
        run: |
          set -ex
          rm -rf ./engine/obj-aarch64-apple-darwin
          mkdir -p ./engine/obj-x86_64-apple-darwin/dist/bin
          mv ./platform.ini ./engine/obj-x86_64-apple-darwin/dist/bin/platform.ini
          MAR="$(pwd)/nightly-macos-host-mar"
          export MAR
          chmod +x "$MAR"
          npm run package -- --verbose
          mv ./dist/output.mar ./macos.mar

      - name: Upload build artifact (.mar)
        uses: actions/upload-artifact@v6
        with:
          retention-days: 5
          name: macos.mar
          path: ./macos.mar

      - name: Upload build artifact (update manifests)
        uses: actions/upload-artifact@v6
        with:
          retention-days: 5
          name: macos_update_manifest
          path: ./dist/update
