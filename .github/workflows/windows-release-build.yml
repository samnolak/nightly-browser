name: Windows Release Build

on:
  workflow_call:
    inputs:
      arches:
        description: 'JSON list of architectures to build, e.g. ["x86_64","aarch64"]'
        required: true
        type: string
      build-version:
        description: "The version to build"
        required: true
        type: string
      release-branch:
        description: "The channel to build (release or twilight)"
        required: true
        type: string
      MOZ_BUILD_DATE:
        type: string
        required: true
      use-sccache:
        description: "Use sccache with the GitHub Actions cache"
        required: true
        type: boolean
      lto:
        description: "Enable thin LTO"
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  windows-build:
    name: Build Windows - ${{ matrix.arch }}
    # Cross-compiled from Linux: clang-cl and wine come from Mozilla's public
    # taskcluster toolchains, the MSVC/Windows SDK from Microsoft's public
    # servers through Firefox's taskcluster/scripts/misc/get_vs.py.
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    env:
      SCCACHE_GHA_ENABLED: ${{ inputs.use-sccache && 'true' || 'false' }}
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      SURFER_COMPAT: ${{ matrix.arch }}
      SURFER_PLATFORM: win32
      ZEN_CROSS_COMPILING: 1
      ZEN_GA_DISABLE_PGO: 1
      ZEN_DISABLE_LTO: ${{ !inputs.lto && '1' || '' }}
      MOZ_BUILD_DATE: ${{ inputs.MOZ_BUILD_DATE }}
      HAS_WINDOWS_SIGNING: ${{ secrets.NIGHTLY_WINDOWS_PFX_BASE64 != '' && secrets.NIGHTLY_WINDOWS_PFX_PASSWORD != '' }}
      ARCH_SUFFIX: ${{ matrix.arch == 'aarch64' && '-arm64' || '' }}
      ARCH_NAME: ${{ matrix.arch == 'aarch64' && 'arm64' || 'x86_64' }}

    steps:
      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force > /dev/null || true
          sudo fallocate -l 12G /mnt/nightly-swap && sudo chmod 600 /mnt/nightly-swap
          sudo mkswap /mnt/nightly-swap > /dev/null && sudo swapon /mnt/nightly-swap
          df -h / /mnt && free -h

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
        if: ${{ inputs.use-sccache }}
        with:
          disable_annotations: true

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip dos2unix yasm nasm build-essential libgtk2.0-dev libpython3-dev m4 uuid libasound2-dev libcurl4-openssl-dev libdbus-1-dev libdrm-dev libdbus-glib-1-dev libgtk-3-dev libpulse-dev libx11-xcb-dev libxt-dev xvfb lld llvm \
            aria2 cabextract msitools p7zip-full zstd --fix-missing

      - name: Load Surfer CI setup
        env:
          CHANNEL: ${{ inputs.release-branch }}
          VERSION: ${{ inputs.build-version }}
        run: npm run surfer -- ci --brand "$CHANNEL" --display-version "$VERSION"

      - name: Download Firefox and dependencies
        run: npm run download

      # The MSVC redist version pinned in configs/windows/mozconfig changes together
      # with Firefox's build/vs/vs2026.yaml, so it keys the toolchain cache.
      - name: win-cross Cache
        id: cache-win-cross
        uses: actions/cache@v5
        with:
          path: ~/win-cross
          key: win-cross-${{ hashFiles('configs/windows/mozconfig') }}

      - name: Setup for Windows (wine and Visual Studio)
        if: steps.cache-win-cross.outputs.cache-hit != 'true'
        working-directory: engine
        run: |
          set -x
          mkdir -p ~/win-cross
          aria2c "https://firefox-ci-tc.services.mozilla.com/api/index/v1/task/gecko.cache.level-3.toolchains.v3.linux64-wine.latest/artifacts/public/build/wine.tar.zst" -o wine.tar.zst
          tar --zstd -xf wine.tar.zst -C ~/win-cross
          rm wine.tar.zst
          ./mach python --virtualenv build taskcluster/scripts/misc/get_vs.py build/vs/vs2026.yaml ~/win-cross/vs2026

      - name: Import
        env:
          # Optional: the Authenticode certificate subject/issuer the updater accepts.
          SURFER_CERT_PATCH_NAME: ${{ secrets.NIGHTLY_WINDOWS_CERT_SUBJECT_NAME }}
          SURFER_CERT_PATCH_ISSUER: ${{ secrets.NIGHTLY_WINDOWS_CERT_ISSUER }}
        run: npm run import -- --verbose

      - name: Bootstrap
        run: |
          chmod -R +x ~/win-cross/vs2026 || true
          npm run bootstrap
          echo "export LIB=\"$(cd ~/.mozbuild/clang/lib/clang/* && cd lib/windows && pwd)\"" >> configs/common/mozconfig

      - name: Setup Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain "$(cat .rust-toolchain)"
          . "$HOME/.cargo/env"
          rustup target add "${SURFER_COMPAT}-pc-windows-msvc"
          WINDOWS_RS_VERSION=$(cat build/windows/.windows-rs-version)
          curl -fsSL "https://static.crates.io/crates/cargo-download/cargo-download-0.1.2.crate" | tar xz -C /tmp
          (cd /tmp/cargo-download-0.1.2 && cargo generate-lockfile && cargo update tinyvec --precise 1.12.0)
          RUSTFLAGS="--cap-lints=allow" cargo install --path /tmp/cargo-download-0.1.2 --locked
          cd engine/
          cargo download -x "windows=$WINDOWS_RS_VERSION"
          printf '\nexport MOZ_WINDOWS_RS_DIR=%s\n' "$(pwd)/windows-$WINDOWS_RS_VERSION" >> ../configs/common/mozconfig

      - name: Build language packs
        run: sh scripts/download-language-packs.sh

      - name: Build
        env:
          NIGHTLY_SAFEBROWSING_API_KEY: ${{ secrets.NIGHTLY_SAFEBROWSING_API_KEY }}
          NIGHTLY_MOZILLA_API_KEY: ${{ secrets.NIGHTLY_MOZILLA_API_KEY }}
          # Firefox doesn't support the Google location service on Windows.
        run: |
          dos2unix configs/windows/mozconfig
          bash .github/workflows/src/release-build.sh

      - name: Prepare Authenticode signing
        if: env.HAS_WINDOWS_SIGNING == 'true'
        env:
          NIGHTLY_WINDOWS_PFX_BASE64: ${{ secrets.NIGHTLY_WINDOWS_PFX_BASE64 }}
          NIGHTLY_WINDOWS_PFX_PASSWORD: ${{ secrets.NIGHTLY_WINDOWS_PFX_PASSWORD }}
        run: |
          sudo apt-get install -y osslsigncode
          umask 077
          printf '%s' "$NIGHTLY_WINDOWS_PFX_BASE64" | base64 -d > "$RUNNER_TEMP/authenticode.pfx"
          printf '%s' "$NIGHTLY_WINDOWS_PFX_PASSWORD" > "$RUNNER_TEMP/authenticode.pass"

      - name: Sign binaries (Authenticode)
        if: env.HAS_WINDOWS_SIGNING == 'true'
        run: |
          shopt -s nullglob
          bindir=$(echo engine/obj-*-pc-windows-msvc/dist/bin)
          while IFS= read -r -d '' file; do
            bash .github/workflows/src/authenticode-sign.sh "$file"
          done < <(find -L "$bindir" -type f \( -name '*.exe' -o -name '*.dll' \) -print0)

      - name: Package
        env:
          ZEN_RELEASE: 1
        run: |
          npm run package
          ls ./dist

      - name: Sign installers (Authenticode)
        if: env.HAS_WINDOWS_SIGNING == 'true'
        run: |
          shopt -s nullglob
          for file in dist/nightly.installer*.exe; do
            bash .github/workflows/src/authenticode-sign.sh "$file"
          done

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/authenticode.pfx" "$RUNNER_TEMP/authenticode.pass"

      - name: Rename artifacts
        run: |
          set -x
          # Exact name: packaging also emits nightly-<ver>.en-US.win64[-aarch64].xpt_artifacts.zip
          mv "./dist/nightly-$(npm run --silent surfer -- get version | xargs).en-US.win64${{ matrix.arch == 'aarch64' && '-aarch64' || '' }}.zip" "nightly.win-${ARCH_NAME}.zip"
          mv ./dist/output.mar "windows${ARCH_SUFFIX}.mar"
          mv ./dist/nightly.installer.exe "nightly.installer${ARCH_SUFFIX}.exe"

      - name: Upload artifact (installer)
        uses: actions/upload-artifact@v6
        with:
          retention-days: 5
          name: nightly.installer${{ env.ARCH_SUFFIX }}.exe
          path: ./nightly.installer${{ env.ARCH_SUFFIX }}.exe

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v6
        with:
          retention-days: 5
          name: nightly.win-${{ env.ARCH_NAME }}.zip
          path: ./nightly.win-${{ env.ARCH_NAME }}.zip

      - name: Upload artifact (.mar)
        uses: actions/upload-artifact@v6
        with:
          retention-days: 5
          name: windows${{ env.ARCH_SUFFIX }}.mar
          path: ./windows${{ env.ARCH_SUFFIX }}.mar

      - name: Upload artifact (update manifests)
        uses: actions/upload-artifact@v6
        with:
          retention-days: 5
          name: windows_update_manifest_${{ env.ARCH_NAME }}
          path: ./dist/update
