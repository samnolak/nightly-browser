# Augur v1 (src/zen/embed/ZenEmbedAugur.sys.mjs), only in Ombra's embedded
# runtime: preconnects (DNS, TCP, TLS; never an HTTP request) to the origin of
# a navigation the embedder is about to cause, an agent's open, click or goto
# or a committed address. The global speculative connections stay off
# (network.http.speculative-parallel-limit, privacy.yaml). false turns it off.
- name: ombra.augur.enabled
  value: true

# Its console messages: one line per hint and per outcome at "Info".
- name: ombra.augur.log-level
  value: Info
