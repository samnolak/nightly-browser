# Importers for Chromium-based browsers that upstream Firefox does not ship.
# Like the upstream `browser.migrate.<key>.enabled` prefs, a migrator is
# hidden unless its pref is true.

- name: browser.migrate.arc.enabled
  value: true

- name: browser.migrate.dia.enabled
  value: true
