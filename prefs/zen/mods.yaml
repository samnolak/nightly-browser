- name: zen.mods.updated-value-observer
  value: false

- name: zen.mods.auto-update-days
  value: 20 # In days

# Nightly: no background contact with the Zen mod store; users can still
# update mods from the Mods settings page.
- name: zen.mods.auto-update
  value: false

# === Mark: Site Injection ===
# The Zen mod store (zen-browser.app/mods) stays reachable when the user
# opens it; the actor only runs on pages the user visits.

- name: zen.injections.match-urls
  value: "https://zen-browser.app/*"
  locked: true
  condition: "defined(MOZILLA_OFFICIAL)"

- name: zen.injections.match-urls
  value: "http://localhost/*"
  condition: "!defined(MOZILLA_OFFICIAL)"
